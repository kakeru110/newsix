name = "minpaku-checkin-notify"
main = "src/index.js"
compatibility_date = "2024-11-01"

# `wrangler kv namespace create STATE` で作成したidに書き換える
kv_namespaces = [
  { binding = "STATE", id = "REPLACE_WITH_KV_NAMESPACE_ID" }
]

# 以下はデプロイ後に `wrangler secret put <NAME>` で設定する(このファイルには書かない):
#   WEBHOOK_TOKEN        受信URLの推測防止用トークン(自分でランダムな文字列を生成)
#   SWITCHBOT_LOCK_DEVICE_ID  対象ロックのdeviceId(=MACアドレス)
#   SLACK_WEBHOOK_URL     Slack Incoming Webhook URL

[vars]
CHECKIN_HOUR = "15"
