<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>お問い合わせ | kakeru110</title>
<meta name="description" content="つくったサイトたちへのご意見・ご感想、掲載の追加依頼などはこちらからお願いします。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Stick&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">

  <div class="topline">
    <span class="brand mono">KAKERU<span class="accent">110</span> / CATALOG</span>
    <nav class="site-nav">
      <a href="index.html">INDEX</a>
      <a href="concept.html">CONCEPT</a>
      <a href="contact.html" class="active">CONTACT</a>
    </nav>
  </div>

  <header class="hero">
    <p class="eyebrow mono">SEND A MESSAGE</p>
    <h1>お問い合わせ</h1>
    <p class="lead">ご意見・ご感想、掲載の誤りのご指摘、追加してほしいサイトのご要望などをお寄せください。</p>
  </header>

  <main class="contact-layout">

    <div id="contactSent" class="contact-sent mono" hidden>
      送信しました。ありがとうございます。
    </div>

    <form class="panel contact-form" action="https://formsubmit.co/kakeru.senoo@gmail.com" method="POST">
      <input type="hidden" name="_subject" value="【つくったサイトたち】お問い合わせ">
      <input type="hidden" name="_template" value="table">
      <input type="hidden" name="_captcha" value="true">
      <input type="hidden" name="_next" value="https://kakeru110.github.io/newsix/contact.html?sent=1">
      <input type="text" name="_honey" style="display:none" tabindex="-1" autocomplete="off">

      <label class="contact-field">
        <span>お名前(任意)</span>
        <input type="text" name="name" placeholder="山田太郎" autocomplete="name">
      </label>

      <label class="contact-field">
        <span>メールアドレス<span class="contact-required">必須</span></span>
        <input type="email" name="email" placeholder="you@example.com" required autocomplete="email">
      </label>

      <label class="contact-field">
        <span>件名(任意)</span>
        <input type="text" name="subject" placeholder="例: サイトの掲載について">
      </label>

      <label class="contact-field">
        <span>お問い合わせ内容<span class="contact-required">必須</span></span>
        <textarea name="message" rows="6" placeholder="内容をご記入ください" required></textarea>
      </label>

      <button type="submit" class="contact-submit">送信する</button>
    </form>

    <p class="contact-disclaimer">
      このフォームは外部サービス(FormSubmit)を利用して送信内容をメールに転送しています。個人情報(お名前・メールアドレス等)はお問い合わせ対応の目的以外には使用しません。
    </p>

  </main>

  <footer class="page-footer">
    <span>KAKERU110 CATALOG</span>
    <span>ISSUE <span id="year"></span></span>
  </footer>

</div>
<script src="cursor.js"></script>
<script>
  document.getElementById('year').textContent = new Date().getFullYear();
  if (new URLSearchParams(location.search).get('sent') === '1') {
    document.getElementById('contactSent').hidden = false;
  }
</script>
</body>
</html>
